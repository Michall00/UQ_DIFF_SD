[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uqdiff"
version = "0.1.0"
description = "Epistemic uncertainty quantification for diffusion models via Laplace approximation (FLARE)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aditi Gupta" }
]
keywords = ["diffusion models", "uncertainty quantification", "laplace approximation", "bayesian deep learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "laplace-torch>=0.1",
    "curvlinops-for-pytorch<3",
    "tqdm",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
experiments = [
    "scikit-learn",
    "cmcrameri",
]
stable-diffusion = [
    "diffusers>=0.30",
    "transformers>=4.40",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "pillow>=10",
    "matplotlib",
]
tifa = [
    "openai>=2.30",
    "pillow>=10",
    "pydantic>=2.12",
    "pyyaml>=6.0",
    "transformers>=4.40",
]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"uqdiff.tifa_like" = ["prompt.yaml"]
